---
name: Terraform
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  config-validation:
    uses: appvia/appvia-cicd-workflows/.github/workflows/terraform-module-validation.yml@2a4cf9fe2d9d3ea45b1ad9ed4b5b59d0b50892e1 # main
    name: Config Module
    with:
      working-directory: modules/config

  tagging-validation:
    uses: appvia/appvia-cicd-workflows/.github/workflows/terraform-module-validation.yml@2a4cf9fe2d9d3ea45b1ad9ed4b5b59d0b50892e1 # main
    name: Tagging Module
    with:
      working-directory: modules/tagging

  scheduler-validation:
    uses: appvia/appvia-cicd-workflows/.github/workflows/terraform-module-validation.yml@2a4cf9fe2d9d3ea45b1ad9ed4b5b59d0b50892e1 # main
    name: Scheduler Module
    with:
      working-directory: modules/scheduler

  spoke-validation:
    uses: appvia/appvia-cicd-workflows/.github/workflows/terraform-module-validation.yml@2a4cf9fe2d9d3ea45b1ad9ed4b5b59d0b50892e1 # main
    name: Spoke Module
    with:
      working-directory: modules/spoke

  macro-validation:
    uses: appvia/appvia-cicd-workflows/.github/workflows/terraform-module-validation.yml@2a4cf9fe2d9d3ea45b1ad9ed4b5b59d0b50892e1 # main
    name: Macro Module
    with:
      working-directory: modules/macro
